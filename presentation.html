<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Presentation" />
    <meta
      name="keywords"
      content="HTML, CSS, JavaScript,Bootstraps,jquery,#mhmiyazi,mh miyazi,MHMiyazi,mhmiyazi,mh miyazi"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BevOS</title>
    <link rel="stylesheet" href="css/energy.css" />
  </head>

  <body>
    <section class="team-section" style="min-height: auto; display: block">
      <header>
        <a href="index.html" class="logo"><img src="img/BevOS_can.png" alt="BevOS logo" /></a>
        <!-- replace this with a logo when we figured out what to put-->

        <div class="toggle" onclick="toggleMenu()"></div>
        <div id="header-placeholder"></div>
        
      </header>
    </section>
    <h1 class="presentation-title">Outline Presentation</h1>
    <section class="presentation-section">
      <iframe
        src="src/main/resources/lab_1_outline.pdf"
        width="100%"
        height="800px"
      >
      </iframe>
    </section>
    <h1 class="presentation-title">Google Slides Presentation</h1>
    <section class="presentation-section">
      <iframe 
        src="https://docs.google.com/presentation/d/e/2PACX-1vQaQgXTOZ98_wKQgFDpHl9eaEAYgB9HCvZe6ZE5oqJx37Sx45DKX7PDG8dr7H0v8ztWIGFozytmJrNs/pubembed?start=false&loop=false&delayms=3000"
        frameborder="0"
        width="100%"
        height="800px"
        allowfullscreen="true"
        mozallowfullscreen="true"
        webkitallowfullscreen="true">
      </iframe>
    </section>
     <script>
      fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });
    </script>
  </body>
</html>
